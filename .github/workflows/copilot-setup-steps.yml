name: Copilot Setup Steps

# Runs automatically when changed so the setup can be validated, and can be
# run manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` to be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          # Keep ruff in sync with the lint job in pythonpackage.yml.
          pip install ruff==0.16.8 maturin pytest pytest-benchmark

      - name: Build and install hexhamming
        run: pip install .

      # Pre-builds the Rust test binaries so the first `cargo test` is fast.
      - name: Build Rust tests
        run: cargo test --no-default-features --no-run
