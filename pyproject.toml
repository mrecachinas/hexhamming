[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "hexhamming"
version = "3.0.0"
description = "Fast Hamming distance calculation for hexadecimal strings"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Michael Recachinas", email = "m.recachinas@gmail.com" }
]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["hamming", "distance", "simd"]

[project.urls]
Homepage = "https://github.com/mrecachinas/hexhamming"
Repository = "https://github.com/mrecachinas/hexhamming.git"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-benchmark",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "hexhamming"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.check-manifest]
ignore = ["uv.lock"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
