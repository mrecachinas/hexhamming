[package]
name = "hexhamming"
version = "2.2.3"
edition = "2021"
description = "Fast Hamming distance calculation for hexadecimal strings"
license = "MIT"

[lib]
name = "hexhamming"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
