[package]
name = "hexhamming"
version = "3.0.0"
edition = "2021"
description = "Fast Hamming distance calculation for hexadecimal strings"
license = "MIT"

[lib]
name = "hexhamming"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["pyo3", "pyo3-build-config"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
rayon = "1.10"

[build-dependencies]
pyo3-build-config = { version = "0.29", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "hamming_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
